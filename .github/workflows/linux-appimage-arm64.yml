name: Linux AppImage ARM64

on:
  push:
    branches:
      - codex/linux-tauri-v2.2.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-appimage-arm64:
    # Native ARM64 build against Ubuntu 22.04. The packaged loader/libc keeps
    # the result usable on Kylin V10 ARM64 systems with glibc 2.31.
    runs-on: ubuntu-22.04-arm
    container: ubuntu:22.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify native ARM64 runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"

      - name: Install Linux desktop build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            desktop-file-utils \
            file \
            fuse \
            git \
            libfuse2 \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libtbb12 \
            librsvg2-dev \
            libwayland-client0 \
            libwayland-cursor0 \
            libwayland-egl1 \
            libgbm1 \
            libdrm2 \
            libegl1 \
            libgl1 \
            libglx0 \
            libopengl0 \
            libfreetype6 \
            libfontconfig1 \
            libharfbuzz0b \
            libgraphite2-3 \
            libpng16-16 \
            libjpeg8 \
            libwebp7 \
            libwebpdemux2 \
            libwebpmux3 \
            libbrotli1 \
            libexpat1 \
            libzstd1 \
            libbz2-1.0 \
            libffi8 \
            libpcre2-8-0 \
            libsqlite3-0 \
            libicu70 \
            libxml2 \
            libxslt1.1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            patchelf \
            pkg-config \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv \
            squashfs-tools \
            xvfb \
            zsync
          apt-get clean
          find /var/lib/apt/lists -mindepth 1 -delete

      - name: Install packaging helper dependencies
        run: python3 -m pip install packaging

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux ARM64 AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max-old-space-size=8192"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash scripts/pack-tauri/build_linux_appimage.sh

      - name: Validate AppImage and bundled glibc runtime
        run: |
          set -euo pipefail
          APPIMAGE="$(find dist -maxdepth 1 -type f -name 'QwenPaw-Tauri-*-Linux-aarch64.AppImage' -print -quit)"
          APPDIR="console/src-tauri/target/release/bundle/appimage/QwenPaw.AppDir"
          test -n "$APPIMAGE"
          test -d "$APPDIR"
          file "$APPIMAGE" | grep -Eiq 'ARM aarch64|aarch64'
          chmod +x "$APPIMAGE"
          test -x "$APPDIR/usr/lib/ld-linux-aarch64.so.1"
          test -e "$APPDIR/usr/lib/libstdc++.so.6"
          test -e "$APPDIR/usr/lib/libgcc_s.so.1"
          test -e "$APPDIR/usr/lib/libwayland-client.so.0"
          test -e "$APPDIR/usr/lib/libwayland-cursor.so.0"
          test -e "$APPDIR/usr/lib/libfreetype.so.6"
          test -e "$APPDIR/usr/lib/libxkbcommon.so.0"
          grep -aFq 'GLIBCXX_3.4.30' "$APPDIR/usr/lib/libstdc++.so.6"
          test -x "$APPDIR/usr/bin/qwenpaw-desktop"
          file "$APPDIR/usr/bin/qwenpaw-desktop" | grep -Eiq 'ARM aarch64|aarch64'
          readelf --version-info "$APPDIR/usr/bin/qwenpaw-desktop" | grep -Eo 'GLIBC_[0-9.]+' | sort -Vu | tail -5 || true

          RUNTIME_LIBS="$(
            "$APPDIR/usr/lib/ld-linux-aarch64.so.1" \
              --library-path "$APPDIR/usr/lib:$APPDIR/usr/lib/aarch64-linux-gnu" \
              --list "$APPDIR/usr/bin/qwenpaw-desktop"
          )"
          grep -Fq "$APPDIR/usr/lib/libstdc++.so.6" <<<"$RUNTIME_LIBS"
          grep -Fq "$APPDIR/usr/lib/libgcc_s.so.1" <<<"$RUNTIME_LIBS"

          APPIMAGE_OFFSET="$(env -u APPIMAGE_EXTRACT_AND_RUN "$APPIMAGE" --appimage-offset)"
          test "$APPIMAGE_OFFSET" -gt 0
          unsquashfs -o "$APPIMAGE_OFFSET" -s "$APPIMAGE"
          unsquashfs -o "$APPIMAGE_OFFSET" -ll "$APPIMAGE" >/tmp/qwenpaw-appimage-files.txt
          grep -q 'usr/bin/qwenpaw-desktop' /tmp/qwenpaw-appimage-files.txt
          grep -q 'usr/lib/ld-linux-aarch64.so.1' /tmp/qwenpaw-appimage-files.txt
          grep -q 'usr/lib/libstdc++.so.6' /tmp/qwenpaw-appimage-files.txt
          grep -q 'usr/lib/libgcc_s.so.1' /tmp/qwenpaw-appimage-files.txt
          grep -q 'usr/lib/libwayland-client.so.0' /tmp/qwenpaw-appimage-files.txt
          grep -q 'usr/lib/libwayland-cursor.so.0' /tmp/qwenpaw-appimage-files.txt
          grep -q 'usr/lib/libfreetype.so.6' /tmp/qwenpaw-appimage-files.txt

          set +e
          timeout 45s xvfb-run -a "$APPDIR/AppRun" >/tmp/qwenpaw-tauri.log 2>&1
          APP_STATUS=$?
          set -e
          if [ "$APP_STATUS" -ne 0 ] && [ "$APP_STATUS" -ne 124 ]; then
            cat /tmp/qwenpaw-tauri.log
            exit "$APP_STATUS"
          fi

      - name: Prune build intermediates before upload
        run: |
          set -euo pipefail
          for path in \
            console/node_modules \
            console/dist \
            console/dist-tauri \
            console/src-tauri/binaries \
            console/src-tauri/target \
            dist/pyinstaller \
            dist/pyinstaller-build \
            dist/pyinstaller-venv; do
            if [ -e "$path" ]; then
              find "$path" -depth -delete
            fi
          done
          df -h .

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: QwenPaw-Tauri-v2.2.1-Linux-aarch64-AppImage
          path: dist/QwenPaw-Tauri-*-Linux-aarch64.AppImage
          if-no-files-found: error
          compression-level: 0
