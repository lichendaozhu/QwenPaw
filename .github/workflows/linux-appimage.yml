name: Linux AppImage

on:
  push:
    branches:
      - codex/linux-tauri-v2.2.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-appimage:
    # Build against Ubuntu 22.04's WebKitGTK 4.1/GLib 2.72. The AppImage
    # builder bundles this runtime plus its loader/libc for glibc 2.31 hosts.
    runs-on: ubuntu-22.04
    container: ubuntu:22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            desktop-file-utils \
            file \
            fuse \
            git \
            libfuse2 \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libtbb12 \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            patchelf \
            pkg-config \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv \
            xvfb \
            zsync

      - name: Install packaging helper dependencies
        run: python3 -m pip install packaging

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max-old-space-size=8192"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash scripts/pack-tauri/build_linux_appimage.sh

      - name: Validate AppImage and bundled glibc runtime
        run: |
          APPIMAGE="$(find dist -maxdepth 1 -type f -name 'QwenPaw-Tauri-*-Linux-x86_64.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          file "$APPIMAGE" | grep -Eiq 'x86-64|x86_64'
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract >/dev/null
          test -x squashfs-root/usr/lib/ld-linux-x86-64.so.2
          test -x squashfs-root/usr/bin/qwenpaw-desktop
          readelf --version-info squashfs-root/usr/bin/qwenpaw-desktop | grep -Eo 'GLIBC_[0-9.]+' | sort -Vu | tail -5 || true
          timeout 45s xvfb-run -a squashfs-root/AppRun >/tmp/qwenpaw-tauri.log 2>&1 || test $? -eq 124

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: QwenPaw-Tauri-v2.2.1-Linux-x86_64-AppImage
          path: dist/QwenPaw-Tauri-*-Linux-x86_64.AppImage
