name: Linux AppImage

on:
  push:
    branches:
      - codex/linux-appimage-v2.1.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-appimage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libappindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging helper dependencies
        run: python -m pip install packaging

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: bash scripts/pack-tauri/build_linux_appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: QwenPaw-Tauri-v2.1.0-Linux-x86_64-AppImage
          path: dist/QwenPaw-Tauri-*-Linux-x86_64.AppImage
