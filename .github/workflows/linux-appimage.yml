name: Linux AppImage

on:
  push:
    branches:
      - codex/linux-appimage-v2.2.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-appimage:
    # Use an available hosted runner, but compile inside Ubuntu 20.04 so the
    # AppImage stays compatible with the user's glibc 2.31 system.
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            desktop-file-utils \
            file \
            fuse \
            git \
            libfuse2 \
            libappindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libtbb2 \
            librsvg2-dev \
            libwebkit2gtk-4.0-dev \
            patchelf \
            pkg-config \
            zsync

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging helper dependencies
        run: python -m pip install packaging

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max-old-space-size=8192"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash scripts/pack-tauri/build_linux_appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: QwenPaw-Tauri-v2.2.0-Linux-x86_64-AppImage
          path: dist/QwenPaw-Tauri-*-Linux-x86_64.AppImage
